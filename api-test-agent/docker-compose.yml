services:
  # ── Mock 业务接口服务 ──────────────────────────────
  mock:
    build: .
    image: api-test-agent:latest
    container_name: mock-server
    command: uvicorn mock_server.mock_api:app --host 0.0.0.0 --port 8001
    ports:
      - "8001:8001"
    environment:
      - TEST_BASE_URL=http://mock:8001
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/api/user/login", "-X", "POST", "-H", "Content-Type: application/json", "-d", '{"username":"admin","password":"123456"}']
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Streamlit 前端 ──────────────────────────────────
  streamlit:
    build: .
    image: api-test-agent:latest
    container_name: streamlit-ui
    command: streamlit run app/streamlit_app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    environment:
      - TEST_BASE_URL=http://mock:8001
      - OPENAI_API_KEY=${OPENAI_API_KEY:-sk-placeholder}
      - BASE_URL=${BASE_URL:-https://api.deepseek.com}
      - MODEL_NAME=${MODEL_NAME:-deepseek-chat}
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./generated_tests:/app/generated_tests
    depends_on:
      mock:
        condition: service_healthy
    restart: unless-stopped

  # ── FastAPI 后端（可选）────────────────────────────
  api:
    build: .
    image: api-test-agent:latest
    container_name: fastapi-api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - TEST_BASE_URL=http://mock:8001
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./generated_tests:/app/generated_tests
    depends_on:
      mock:
        condition: service_healthy
    restart: unless-stopped
